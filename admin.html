<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云际小铺 管理后台</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;background:#f6f1e7;color:#18212f}button,input,select{font:inherit}.login{max-width:380px;margin:12vh auto;background:#fff;padding:30px;border-radius:20px}.login input,.field{width:100%;padding:11px;border:1px solid #e3e8ef;border-radius:10px;margin:6px 0}.btn{border:0;background:#b9523a;color:white;padding:11px 16px;border-radius:10px;cursor:pointer}.app{display:none}.side{position:fixed;width:220px;inset:0 auto 0 0;background:#243a4a;color:#fff;padding:24px}.side h2{margin-top:0}.side button{display:block;width:100%;text-align:left;background:transparent;color:#cbd5df;border:0;padding:12px;border-radius:9px}.side button:hover{background:#33505f}.main{margin-left:220px;padding:28px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:#fff;border:1px solid #e8edf3;border-radius:16px;padding:18px}.card b{font-size:28px;display:block;margin-top:8px}.panel{margin-top:18px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:800px}th,td{text-align:left;padding:11px;border-bottom:1px solid #edf0f3;font-size:13px}.actions button{margin-right:5px}.top{display:flex;justify-content:space-between;align-items:center}.modal{display:none;position:fixed;inset:0;background:#0006;align-items:center;justify-content:center}.modal.show{display:flex}.modal>div{background:white;width:420px;max-width:92%;padding:22px;border-radius:18px}@media(max-width:800px){.side{position:static;width:auto}.main{margin:0}.cards{grid-template-columns:1fr 1fr}}</style></head><body>
<div class="login" id="login"><h2>云际小铺 管理后台</h2><p>首次运行请使用 README 中的演示账号，并在部署时通过环境变量修改密码。</p><input id="user" placeholder="管理员账号" value="admin"><input id="pass" type="password" placeholder="管理员密码"><button class="btn" onclick="doLogin()">登录</button></div>
<div class="app" id="app"><aside class="side"><h2>云际小铺 后台</h2><button onclick="show('dash')">仪表盘</button><button onclick="show('products')">商品管理</button><button onclick="show('orders')">订单管理</button><button onclick="logout()">退出登录</button></aside><main class="main"><div class="top"><div><small>云际小铺</small><h1 id="title">仪表盘</h1></div><a href="/" target="_blank">查看前台 ↗</a></div><section id="dash"><div class="cards"><div class="card">商品数<b id="c1">0</b></div><div class="card">订单数<b id="c2">0</b></div><div class="card">演示流水<b id="c3">¥0</b></div><div class="card">低库存<b id="c4">0</b></div></div><div class="panel"><h3>说明</h3><p>这是可运行的第一版：后台改价格、库存或上下架后，前台刷新即可同步。订单为演示订单，不包含真实支付。</p></div></section><section id="products" style="display:none"><div class="panel"><button class="btn" onclick="edit()">＋ 新增商品</button><table><thead><tr><th>ID</th><th>商品</th><th>价格</th><th>库存</th><th>状态</th><th>操作</th></tr></thead><tbody id="pt"></tbody></table></div></section><section id="orders" style="display:none"><div class="panel"><table><thead><tr><th>订单号</th><th>商品</th><th>金额</th><th>邮箱</th><th>状态</th><th>时间</th></tr></thead><tbody id="ot"></tbody></table></div></section></main></div>
<div class="modal" id="modal"><div><h3>商品编辑</h3><input type="hidden" id="pid"><input class="field" id="pn" placeholder="商品名称"><input class="field" id="pp" type="number" step="0.01" placeholder="价格"><input class="field" id="ps" type="number" placeholder="库存"><select class="field" id="pc"><option value="1">AI 工具</option><option value="2">创作工具</option><option value="3">会员服务</option><option value="4">开发工具</option><option value="5">效率工具</option></select><input class="field" id="pi" placeholder="图标，如 ✦"><select class="field" id="pst"><option value="1">上架</option><option value="0">下架</option></select><button class="btn" onclick="save()">保存</button> <button onclick="closeM()">取消</button></div></div>
<script>
let T=localStorage.novaToken||'', P=[];
async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+T};let r=await fetch(url,opt);let d=await r.json();if(r.status===401){logout();throw Error('未登录')}if(!r.ok)throw Error(d.error||'请求失败');return d}
async function doLogin(){let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user.value,password:pass.value})});let d=await r.json();if(!r.ok)return alert(d.error);T=d.token;localStorage.novaToken=T;start()}
function logout(){localStorage.removeItem('novaToken');T='';app.style.display='none';login.style.display='block'}
async function start(){try{await api('/api/admin/dashboard');login.style.display='none';app.style.display='block';loadDash()}catch(e){}}
async function loadDash(){let d=await api('/api/admin/dashboard');c1.textContent=d.products;c2.textContent=d.orders;c3.textContent='¥'+d.revenue.toFixed(2);c4.textContent=d.low_stock}
function show(x){['dash','products','orders'].forEach(i=>document.getElementById(i).style.display=i===x?'block':'none');title.textContent=x==='dash'?'仪表盘':x==='products'?'商品管理':'订单管理';if(x==='products')loadP();if(x==='orders')loadO();if(x==='dash')loadDash()}
async function loadP(){P=await api('/api/admin/products');pt.innerHTML=P.map(p=>`<tr><td>${p.id}</td><td>${p.icon||''} ${p.name}</td><td>¥${(+p.price).toFixed(2)}</td><td>${p.stock}</td><td>${p.status?'上架':'下架'}</td><td class="actions"><button onclick="edit(${p.id})">编辑</button><button onclick="delP(${p.id})">删除</button></td></tr>`).join('')}
function edit(id){let p=P.find(x=>x.id===id)||{};pid.value=p.id||'';pn.value=p.name||'';pp.value=p.price??'';ps.value=p.stock??'';pc.value=p.category_id||1;pi.value=p.icon||'✦';pst.value=p.status??1;modal.classList.add('show')}
function closeM(){modal.classList.remove('show')}
async function save(){let b={name:pn.value,price:+pp.value,stock:+ps.value,category_id:+pc.value,icon:pi.value,status:+pst.value,badge:'推荐'},id=pid.value;await api(id?'/api/admin/products/'+id:'/api/admin/products',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});closeM();loadP();loadDash()}
async function delP(id){if(!confirm('确认删除？'))return;await api('/api/admin/products/'+id,{method:'DELETE'});loadP();loadDash()}
async function loadO(){let o=await api('/api/admin/orders');ot.innerHTML=o.map(x=>`<tr><td>${x.order_no}</td><td>${x.product_name}</td><td>¥${(+x.amount).toFixed(2)}</td><td>${x.email}</td><td><select onchange="setO(${x.id},this.value)"><option ${x.status==='待处理'?'selected':''}>待处理</option><option ${x.status==='已完成'?'selected':''}>已完成</option><option ${x.status==='已取消'?'selected':''}>已取消</option></select></td><td>${new Date(x.created_at).toLocaleString()}</td></tr>`).join('')}
async function setO(id,status){await api('/api/admin/orders/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});loadDash()}
if(T)start();
</script></body></html>
